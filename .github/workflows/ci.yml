name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go and Python quality gates
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: example
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pexample"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_DSN: ${{ format('root:{0}@tcp(127.0.0.1:3306)/?parseTime=true', 'example') }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python project dependencies
        run: make setup-python

      - name: Run format, tests, vet, build, and secret checks
        run: ./tools/check.sh
