replicaCount: 1

image:
  repository: stock-quant
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

# These values are consumed by pkg/config at process startup.
env:
  SERVICE_NAME: stock-quant
  APP_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  LOG_OUTPUT: console
  # Set LOG_OUTPUT to file only when LOG_DIR is backed by a writable volume.
  LOG_DIR: /var/log/stock-quant

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: stock-quant.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /heartbeat
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /probe
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
