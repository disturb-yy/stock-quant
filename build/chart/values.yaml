replicaCount: 1

image:
  repository: stock-quant
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

containerPort: 8357

service:
  type: ClusterIP
  port: 8357

# 这些配置由 pkg/config 在进程启动时读取。
env:
  SERVICE_NAME: stock-quant
  HTTP_ADDRESS: :8357
  APP_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  LOG_OUTPUT: console
# 仅当 LOG_DIR 由可写卷承载时，才将 LOG_OUTPUT 设置为 file。
  LOG_DIR: /var/log/stock-quant

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: stock-quant.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
