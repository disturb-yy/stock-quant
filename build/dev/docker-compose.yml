services:
  mysql:
    image: mysql:8.4
    container_name: stock-quant-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-stock_quant_dev}
      MYSQL_USER: ${DB_USER:-stock_quant}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock_quant_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stock_quant_root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - stock-quant-dev-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  stock-quant-dev-mysql:
